name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Server Tests
    timeout-minutes: 30

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Check for tests
        id: check-tests
        run: |
          if find . -name "test_*.py" -type f | head -1 | grep -q .; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
            echo "✅ Found test files"
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "⚠️ No test files found, skipping tests"
          fi

      - name: Setup Python
        if: steps.check-tests.outputs.has_tests == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Setup Node
        if: steps.check-tests.outputs.has_tests == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache pip
        if: steps.check-tests.outputs.has_tests == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        if: steps.check-tests.outputs.has_tests == 'true'
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        if: steps.check-tests.outputs.has_tests == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        if: steps.check-tests.outputs.has_tests == 'true'
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Setup Frappe Bench
        if: steps.check-tests.outputs.has_tests == 'true'
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install App
        if: steps.check-tests.outputs.has_tests == 'true'
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app ampower_kj $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app ampower_kj
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        if: steps.check-tests.outputs.has_tests == 'true'
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app ampower_kj --failfast
        env:
          TYPE: server

      - name: Skip Tests Notice
        if: steps.check-tests.outputs.has_tests == 'false'
        run: echo "⚠️ No tests found - workflow passed without running tests"
